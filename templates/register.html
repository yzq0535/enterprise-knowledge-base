<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 企业知识库</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo"><i class="fas fa-building"></i></div>
                <h1>申请注册</h1>
                <p>注册后请联系管理员开通权限</p>
            </div>
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名 <span class="required">*</span></label>
                    <input type="text" id="reg-username" placeholder="至少3个字符" required minlength="3" class="form-input">
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="reg-displayname" placeholder="您的真实姓名" class="form-input">
                </div>
                <div class="form-group">
                    <label>密码 <span class="required">*</span></label>
                    <input type="password" id="reg-password" placeholder="至少6个字符" required minlength="6" class="form-input">
                </div>
                <div class="form-group">
                    <label>确认密码 <span class="required">*</span></label>
                    <input type="password" id="reg-password2" placeholder="再次输入密码" required class="form-input">
                </div>
                <div id="reg-error" class="auth-error" style="display:none"></div>
                <button type="submit" class="btn btn-primary btn-block" id="reg-btn">
                    <i class="fas fa-user-plus"></i> 注 册
                </button>
            </form>
            <div class="auth-footer">
                <span>已有账号？</span>
                <a href="/login">返回登录</a>
            </div>
        </div>
    </div>
    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const pwd = document.getElementById('reg-password').value;
            const pwd2 = document.getElementById('reg-password2').value;
            const errEl = document.getElementById('reg-error');

            if (pwd !== pwd2) {
                errEl.textContent = '两次密码输入不一致';
                errEl.style.display = 'block';
                return;
            }

            const btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 注册中...';
            errEl.style.display = 'none';

            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('reg-username').value,
                        password: pwd,
                        display_name: document.getElementById('reg-displayname').value
                    })
                });
                const data = await resp.json();
                if (resp.ok) {
                    alert('注册成功！请联系管理员开通权限后登录。');
                    window.location.href = '/login';
                } else {
                    errEl.textContent = data.error || '注册失败';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = '网络错误';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> 注 册';
            }
        }
    </script>
</body>
</html>
