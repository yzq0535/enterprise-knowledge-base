{% extends "base.html" %}

{% block title %}用户管理 - 企业知识库{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-left">
        <h1><i class="fas fa-users-cog"></i> 用户管理</h1>
        <p class="subtitle">管理系统用户和权限</p>
    </div>
    <div class="header-right">
        <button class="btn btn-primary" onclick="openCreateUserModal()">
            <i class="fas fa-user-plus"></i> 添加用户
        </button>
    </div>
</div>

<div class="user-table-wrap">
    <table class="data-table">
        <thead>
            <tr>
                <th>用户名</th>
                <th>姓名</th>
                <th>角色</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>最后登录</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="user-table-body"></tbody>
    </table>
</div>

<!-- 创建/编辑用户模态框 -->
<div class="modal-overlay" id="user-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="user-modal-title">添加用户</h2>
            <button class="modal-close" onclick="closeUserModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="edit-user-id">
            <div class="form-group">
                <label>用户名 <span class="required">*</span></label>
                <input type="text" id="edit-username" class="form-input" placeholder="用户名">
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="edit-displayname" class="form-input" placeholder="显示名称">
            </div>
            <div class="form-group">
                <label>角色 <span class="required">*</span></label>
                <select id="edit-role" class="form-input">
                    <option value="viewer">访客（仅浏览）</option>
                    <option value="user">编辑者（可上传）</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <div class="form-group" id="password-group">
                <label>密码 <span class="required">*</span></label>
                <input type="password" id="edit-password" class="form-input" placeholder="设置密码">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeUserModal()">取消</button>
            <button class="btn btn-primary" onclick="saveUser()"><i class="fas fa-save"></i> 保存</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', loadUsers);

    async function loadUsers() {
        try {
            const resp = await fetch('/api/admin/users');
            const data = await resp.json();
            const roleMap = {admin: '管理员', user: '编辑者', viewer: '访客'};
            const roleColors = {admin: '#ef4444', user: '#3b82f6', viewer: '#6b7280'};

            document.getElementById('user-table-body').innerHTML = data.users.map(u => `
                <tr>
                    <td><strong>${escapeHtml(u.username)}</strong></td>
                    <td>${escapeHtml(u.display_name || '-')}</td>
                    <td><span class="role-badge" style="background:${roleColors[u.role]}20;color:${roleColors[u.role]}">${roleMap[u.role]}</span></td>
                    <td>${u.is_active ? '<span class="status-badge status-success">正常</span>' : '<span class="status-badge status-danger">禁用</span>'}</td>
                    <td>${u.created_at ? u.created_at.substring(0,10) : '-'}</td>
                    <td>${u.last_login || '-'}</td>
                    <td>
                        <button class="btn-icon" onclick="editUser(${u.id},'${escapeHtml(u.username)}','${escapeHtml(u.display_name||'')}','${u.role}',${u.is_active})" title="编辑"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon" onclick="toggleUserStatus(${u.id},${u.is_active})" title="${u.is_active?'禁用':'启用'}"><i class="fas fa-${u.is_active?'ban':'check'}"></i></button>
                        <button class="btn-icon" onclick="deleteUser(${u.id},'${escapeHtml(u.username)}')" title="删除"><i class="fas fa-trash" style="color:var(--danger)"></i></button>
                    </td>
                </tr>
            `).join('');
        } catch(e) {}
    }

    function openCreateUserModal() {
        document.getElementById('user-modal-title').textContent = '添加用户';
        document.getElementById('edit-user-id').value = '';
        document.getElementById('edit-username').value = '';
        document.getElementById('edit-username').disabled = false;
        document.getElementById('edit-displayname').value = '';
        document.getElementById('edit-role').value = 'viewer';
        document.getElementById('edit-password').value = '';
        document.getElementById('password-group').style.display = 'block';
        document.getElementById('user-modal').classList.add('active');
    }

    function editUser(id, username, displayName, role, isActive) {
        document.getElementById('user-modal-title').textContent = '编辑用户';
        document.getElementById('edit-user-id').value = id;
        document.getElementById('edit-username').value = username;
        document.getElementById('edit-username').disabled = true;
        document.getElementById('edit-displayname').value = displayName;
        document.getElementById('edit-role').value = role;
        document.getElementById('edit-password').value = '';
        document.getElementById('password-group').style.display = 'block';
        document.getElementById('user-modal').classList.add('active');
    }

    async function saveUser() {
        const id = document.getElementById('edit-user-id').value;
        const username = document.getElementById('edit-username').value.trim();
        const password = document.getElementById('edit-password').value;

        if (!id && !password) {
            showToast('请输入密码', 'error'); return;
        }

        const body = {
            display_name: document.getElementById('edit-displayname').value,
            role: document.getElementById('edit-role').value,
        };
        if (password) body.new_password = password;

        try {
            const url = id ? `/api/admin/users/${id}` : '/api/admin/users';
            const method = id ? 'PUT' : 'POST';
            if (!id) body.username = username;
            body.password = password;

            const resp = await fetch(url, {
                method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
            });
            const data = await resp.json();
            if (resp.ok) {
                showToast(data.message, 'success');
                closeUserModal();
                loadUsers();
            } else {
                showToast(data.error, 'error');
            }
        } catch(e) {}
    }

    async function toggleUserStatus(id, current) {
        try {
            const resp = await fetch(`/api/admin/users/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({is_active: !current})
            });
            if (resp.ok) { showToast('操作成功', 'success'); loadUsers(); }
        } catch(e) {}
    }

    async function deleteUser(id, username) {
        if (!confirm(`确定删除用户「${username}」吗？`)) return;
        try {
            const resp = await fetch(`/api/admin/users/${id}`, {method: 'DELETE'});
            const data = await resp.json();
            if (resp.ok) { showToast(data.message, 'success'); loadUsers(); }
            else showToast(data.error, 'error');
        } catch(e) {}
    }

    function closeUserModal() {
        document.getElementById('user-modal').classList.remove('active');
    }
</script>
{% endblock %}
