<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}企业知识库{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-building"></i>
                <span>企业知识库</span>
            </div>
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
            <!-- 导航由JS根据角色动态生成 -->
        </nav>
        <div class="sidebar-footer">
            <div class="user-info-mini" id="user-info-mini"></div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 顶部栏 -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle-mobile" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="topbar-right">
                <div class="notification-bell" id="notification-bell" onclick="toggleNotifications()" style="display:none">
                    <i class="fas fa-bell"></i>
                    <span class="badge-count" id="unread-count">0</span>
                </div>
                <div class="user-dropdown" id="user-dropdown">
                    <button class="user-btn" onclick="toggleUserMenu()">
                        <span class="user-avatar" id="user-avatar">A</span>
                        <span class="user-name" id="user-name">用户</span>
                        <span class="user-role" id="user-role"></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-menu" id="user-menu">
                        <a href="/my"><i class="fas fa-user"></i> 个人中心</a>
                        <a href="#" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 通知面板 -->
        <div class="notification-panel" id="notification-panel" style="display:none">
            <div class="notification-header">
                <h3>通知消息</h3>
                <button onclick="markAllRead()">全部已读</button>
            </div>
            <div class="notification-list" id="notification-list">
                <div class="notification-empty">暂无通知</div>
            </div>
        </div>

        {% block content %}{% endblock %}
    </main>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/common.js"></script>
    <script>
        // 页面加载时初始化用户信息
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const resp = await fetch('/api/auth/current');
                const data = await resp.json();
                if (!data.user) {
                    window.location.href = '/login';
                    return;
                }
                initUI(data.user);
            } catch(e) {
                window.location.href = '/login';
            }
        });

        function initUI(user) {
            // 用户信息
            document.getElementById('user-avatar').textContent = (user.display_name || user.username)[0].toUpperCase();
            document.getElementById('user-name').textContent = user.display_name || user.username;
            const roleMap = {admin: '管理员', user: '编辑者', viewer: '访客'};
            document.getElementById('user-role').textContent = roleMap[user.role] || user.role;
            document.getElementById('user-info-mini').innerHTML =
                `<i class="fas fa-user-circle"></i> ${user.display_name || user.username} (${roleMap[user.role] || user.role})`;

            // 导航菜单（根据角色）
            const nav = document.getElementById('sidebar-nav');
            let navItems = `
                <a href="/" class="nav-item" data-page="/">
                    <i class="fas fa-book-open"></i><span>知识文档</span>
                </a>
                <a href="/qa" class="nav-item" data-page="/qa">
                    <i class="fas fa-comments"></i><span>知识问答</span>
                </a>`;

            if (user.role === 'admin') {
                navItems += `
                <a href="/review" class="nav-item" data-page="/review">
                    <i class="fas fa-clipboard-check"></i><span>审核管理</span>
                    <span class="nav-badge" id="nav-pending-badge" style="display:none">0</span>
                </a>
                <a href="/admin" class="nav-item" data-page="/admin">
                    <i class="fas fa-users-cog"></i><span>用户管理</span>
                </a>
                <a href="/settings" class="nav-item" data-page="/settings">
                    <i class="fas fa-cog"></i><span>系统设置</span>
                </a>`;
            }

            if (user.role === 'user') {
                navItems += `
                <a href="/my" class="nav-item" data-page="/my">
                    <i class="fas fa-file-alt"></i><span>我的文档</span>
                </a>`;
            }

            nav.innerHTML = navItems;

            // 高亮当前页面
            const currentPath = window.location.pathname;
            nav.querySelectorAll('.nav-item').forEach(item => {
                if (item.dataset.page === currentPath) item.classList.add('active');
            });

            // 加载通知
            loadNotifications();
        }

        function toggleUserMenu() {
            document.getElementById('user-menu').classList.toggle('show');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // 点击外部关闭菜单
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#user-dropdown')) {
                document.getElementById('user-menu').classList.remove('show');
            }
            if (!e.target.closest('#notification-bell') && !e.target.closest('#notification-panel')) {
                document.getElementById('notification-panel').style.display = 'none';
            }
        });

        async function handleLogout() {
            await fetch('/api/auth/logout', {method: 'POST'});
            window.location.href = '/login';
        }

        // 通知系统
        async function loadNotifications() {
            try {
                const resp = await fetch('/api/notifications');
                const data = await resp.json();
                const bell = document.getElementById('notification-bell');
                const countEl = document.getElementById('unread-count');
                const listEl = document.getElementById('notification-list');

                if (data.unread_count > 0) {
                    bell.style.display = 'flex';
                    countEl.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
                } else {
                    bell.style.display = 'none';
                }

                if (data.notifications.length === 0) {
                    listEl.innerHTML = '<div class="notification-empty">暂无通知</div>';
                } else {
                    listEl.innerHTML = data.notifications.map(n => `
                        <div class="notification-item ${n.is_read ? '' : 'unread'}" onclick="readNotification(${n.id})">
                            <div class="notification-type">${getNotifIcon(n.type)}</div>
                            <div class="notification-content">
                                <div class="notification-title">${escapeHtml(n.title)}</div>
                                <div class="notification-time">${formatTime(n.created_at)}</div>
                            </div>
                        </div>
                    `).join('');
                }

                // 更新审核待办数
                updatePendingBadge(data.notifications);
            } catch(e) {}
        }

        function getNotifIcon(type) {
            const icons = {
                review_required: '<i class="fas fa-clipboard-check" style="color:#f59e0b"></i>',
                ai_rejected: '<i class="fas fa-exclamation-triangle" style="color:#ef4444"></i>',
                approved: '<i class="fas fa-check-circle" style="color:#22c55e"></i>',
                rejected: '<i class="fas fa-times-circle" style="color:#ef4444"></i>'
            };
            return icons[type] || '<i class="fas fa-bell" style="color:#6366f1"></i>';
        }

        function updatePendingBadge(notifications) {
            const pending = notifications.filter(n => n.type === 'review_required' && !n.is_read).length;
            const badge = document.getElementById('nav-pending-badge');
            if (badge) {
                if (pending > 0) {
                    badge.style.display = 'inline';
                    badge.textContent = pending;
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        function toggleNotifications() {
            const panel = document.getElementById('notification-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        async function readNotification(nid) {
            await fetch(`/api/notifications/${nid}/read`, {method: 'POST'});
            loadNotifications();
        }

        async function markAllRead() {
            await fetch('/api/notifications/read-all', {method: 'POST'});
            loadNotifications();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
